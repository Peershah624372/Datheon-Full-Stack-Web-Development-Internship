<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Forecast</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-default" id="body">
  <main class="app">
    <h1>⛅ Weather Telemetry</h1>
    <form id="search-form" class="search" role="search">
      <input type="text" id="city-input" placeholder="Search any city (e.g. London, Tokyo)…" aria-label="City name" autocomplete="off" required />
      <button type="submit">Search</button>
      <button type="button" id="locate-btn" title="Use my location" aria-label="Use my location">📍</button>
    </form>
    <div class="units"><button id="unit-toggle" class="unit-btn">Switch to °F</button></div>

    <div id="loader" class="loader" hidden><div class="spinner"></div><p>Fetching weather…</p></div>
    <div id="error" class="error" role="alert" hidden></div>

    <section id="weather" hidden>
      <div class="current">
        <div>
          <h2 id="place"></h2>
          <p id="date" class="muted"></p>
          <div class="temp-row"><span id="icon" class="big-icon"></span><span id="temp" class="temp"></span></div>
          <p id="condition" class="condition"></p>
        </div>
        <div class="metrics">
          <div class="metric"><span>💧 Humidity</span><strong id="humidity"></strong></div>
          <div class="metric"><span>💨 Wind</span><strong id="wind"></strong></div>
          <div class="metric"><span>🧭 Pressure</span><strong id="pressure"></strong></div>
          <div class="metric"><span>🌡️ Feels like</span><strong id="feels"></strong></div>
        </div>
      </div>
      <h3 class="forecast-title">5-Day Forecast</h3>
      <div id="forecast" class="forecast"></div>
    </section>
  </main>
  <footer class="credit">Data: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (no API key required)</footer>
  <script src="app.js"></script>
</body>
</html>
