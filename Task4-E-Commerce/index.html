<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopEase – E-Commerce Store</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <a href="#" class="brand">🛍️ ShopEase</a>
    <input type="search" id="search" placeholder="Search products…" aria-label="Search products" />
    <button id="cart-btn" class="cart-btn" aria-label="Open cart">🛒 <span id="cart-count" class="badge">0</span></button>
  </header>

  <main class="container">
    <div id="categories" class="categories" role="group" aria-label="Categories">
      <button class="cat active" data-cat="all">All</button>
      <button class="cat" data-cat="electronics">Electronics</button>
      <button class="cat" data-cat="jewelery">Jewelry</button>
      <button class="cat" data-cat="men's clothing">Men's Clothing</button>
      <button class="cat" data-cat="women's clothing">Women's Clothing</button>
      <select id="sort" aria-label="Sort products">
        <option value="default">Sort: Featured</option>
        <option value="low">Price: Low → High</option>
        <option value="high">Price: High → Low</option>
        <option value="rating">Top rated</option>
      </select>
    </div>

    <div id="status" class="status" role="status"></div>
    <div id="products" class="grid"></div>
  </main>

  <div id="overlay" class="overlay" hidden></div>
  <aside id="drawer" class="drawer" aria-label="Shopping cart" aria-hidden="true">
    <div class="drawer-head"><h2>Your Cart</h2><button id="close-cart" aria-label="Close cart">✕</button></div>
    <div id="cart-items" class="cart-items"></div>
    <div class="cart-summary">
      <div><span>Subtotal</span><span id="subtotal">$0.00</span></div>
      <div><span>Tax (8%)</span><span id="tax">$0.00</span></div>
      <div><span>Shipping</span><span id="shipping">$0.00</span></div>
      <div class="total"><span>Total</span><span id="total">$0.00</span></div>
      <p class="free-note" id="free-note"></p>
      <button id="checkout-btn" class="checkout">Checkout</button>
    </div>
  </aside>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true">
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
