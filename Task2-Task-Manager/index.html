<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TaskFlow – a task manager with categories, due dates, filters and progress insights." />
  <title>TaskFlow – Task Manager</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E⚡%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="board">
    <!-- Sidebar -->
    <aside class="sidebar" aria-label="Categories">
      <div class="brand"><span class="logo" aria-hidden="true"></span>TaskFlow</div>
      <nav class="side-nav">
        <button class="nav-item active" data-cat="all" aria-current="page"><span class="ni" aria-hidden="true">▦</span>Dashboard</button>
        <button class="nav-item" data-cat="Work"><span class="ni" aria-hidden="true">💼</span>Work</button>
        <button class="nav-item" data-cat="Personal"><span class="ni" aria-hidden="true">🏠</span>Personal</button>
        <button class="nav-item" data-cat="Study"><span class="ni" aria-hidden="true">📚</span>Study</button>
      </nav>
      <div class="side-card">
        <p>Stay focused</p>
        <strong id="side-progress">0%</strong>
        <span>of all tasks done</span>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <div class="crumbs">Tasks <span aria-hidden="true">›</span> <span id="crumb-cat">Today</span></div>
      <header class="head">
        <h1>Task Management</h1>
        <p id="summary" class="summary"></p>
      </header>

      <form id="task-form" class="task-form" novalidate>
        <input type="text" id="task-input" placeholder="What needs to be done?" maxlength="120" required aria-label="Task title" />
        <select id="category-input" aria-label="Category">
          <option>Work</option><option>Personal</option><option>Study</option>
        </select>
        <input type="date" id="due-input" aria-label="Due date" />
        <button type="submit" id="submit-btn">+ Add Task</button>
      </form>
      <p id="error" class="error" role="alert"></p>

      <section class="gantt" aria-label="Progress by category" id="gantt"></section>

      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter by status">
          <button class="filter active" data-filter="all" aria-pressed="true">All</button>
          <button class="filter" data-filter="active" aria-pressed="false">Active</button>
          <button class="filter" data-filter="completed" aria-pressed="false">Completed</button>
        </div>
        <select id="category-filter" aria-label="Filter by category">
          <option value="all">All categories</option><option>Work</option><option>Personal</option><option>Study</option>
        </select>
        <select id="sort" aria-label="Sort tasks">
          <option value="manual">My order</option><option value="due">Due date</option><option value="az">A → Z</option>
        </select>
        <input type="search" id="search" placeholder="Search tasks… ( / )" aria-label="Search tasks" />
      </div>

      <ul id="task-list" class="task-list" aria-label="Tasks"></ul>
      <p id="empty" class="empty" hidden></p>

      <footer class="list-foot">
        <button id="clear-completed" class="link-btn">Clear completed</button>
        <span class="hint" id="hint">Tip: drag tasks, or press Alt + ↑/↓, to reorder</span>
      </footer>
    </main>

    <!-- Insights -->
    <aside class="panel" aria-label="Insights">
      <div class="profile">
        <div class="pf-logo" aria-hidden="true"></div>
        <strong>My Productivity</strong>
        <span id="today-label"></span>
      </div>
      <section>
        <h2>Plan</h2>
        <ul id="plan" class="plan"></ul>
      </section>
      <section>
        <h2>Efficiency</h2>
        <div id="rings" class="rings"></div>
      </section>
      <section>
        <h2>Completed tasks</h2>
        <div id="bars" class="bars"></div>
      </section>
    </aside>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden><span id="toast-msg"></span><button id="toast-undo" type="button">Undo</button></div>
  <script src="app.js"></script>
</body>
</html>
